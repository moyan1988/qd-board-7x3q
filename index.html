<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>OKX 实盘看板 · v4</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--fg:#e6e8ee;--mut:#8a90a0;--up:#16c784;--dn:#ea3943;--bd:#272b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding:12px max(12px,env(safe-area-inset-left)) 40px}
h1{font-size:18px;margin:0 0 8px}h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}.kpi{flex:1 1 140px;background:#1f232c;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700}
.live{background:#16c78433;color:var(--up)}.dry{background:#f0b90b33;color:#f0b90b}.stale{background:#ea394333;color:var(--dn)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th,td{padding:6px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
svg{width:100%;height:200px;display:block}.empty{color:var(--mut);padding:8px 0}
.tag{display:inline-block;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700}.t-red{background:#ea394333;color:#ff5b64}.t-yel{background:#f0b90b33;color:#f0b90b}.t-gry{background:#8a90a022;color:var(--mut)}.t-grn{background:#16c78433;color:var(--up)}
.note{font-size:12px;color:var(--mut);margin:-4px 0 8px}td.wrap{white-space:normal;text-align:left;min-width:150px}td.wrap small{color:var(--mut)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}details[open] summary{margin-bottom:4px}.dl{font-size:12px;color:var(--mut);line-height:1.5}
</style></head><body>
<h1>OKX 合约实盘看板 <span id="mode" class="badge">…</span></h1>
<div class="mut" id="sub">加载中…</div>
<div class="card"><div class="row">
<div class="kpi"><span>当前权益 (USDT)</span><b id="eq">-</b></div>
<div class="kpi"><span>累计盈亏 (起始 400U)</span><b id="pnl">-</b></div>
<div class="kpi"><span>浮动盈亏</span><b id="upl">-</b></div>
<div class="kpi"><span>程序心跳</span><b id="hb">-</b></div>
</div><div class="mut" id="rules" style="margin-top:8px;font-size:12px"></div></div>
<div class="card"><h2>Freqtrade 对照组 <span id="ftst" class="badge">…</span></h2><div class="note" id="ftsub"></div><div class="row">
<div class="kpi"><span>估算权益 (USDT)</span><b id="fteq">-</b></div>
<div class="kpi"><span>对照组累计</span><b id="ftpnl">-</b></div>
<div class="kpi"><span>同期 v4.1</span><b id="ftv41">-</b></div>
<div class="kpi"><span>已平仓 / 胜</span><b id="ftcnt">-</b></div>
</div><div class="tw" id="ftpos" style="margin-top:8px"></div><div class="tw" id="fttrd" style="margin-top:8px"></div></div>
<div class="card"><h2>权益曲线（近 7 天）</h2><div id="chart"></div></div>
<div class="card"><h2>当前持仓</h2><div class="tw" id="pos"></div></div>
<div class="card"><h2>各币信号</h2><div class="note">交易只按 v4.1 规则执行；均线方向、预警、资讯仅供参考，不影响开平仓</div><div class="tw" id="sig"></div><div class="note" id="sigfoot" style="margin:6px 0 0"></div></div>
<div class="card"><h2>最近成交</h2><div class="tw" id="trd"></div></div>
<div class="card"><h2>资金费</h2><div class="tw" id="fund"></div></div>
<div class="card"><h2>告警</h2><div class="tw" id="alr"></div></div>
<div class="mut" style="font-size:12px">只读页面，每 60 秒自动刷新。时间为迪拜时间 (UTC+4)。</div>
<script>
// raw branch 'data' is force-pushed every minute (no Pages rebuild); fallback: local/Pages copy
const GH=location.hostname.endsWith('github.io');
// 1) GitHub contents API (~60s cache; ETag revalidation -> 304s don't count toward 60/h limit) 2) raw (~5 min cache) 3) Pages/local copy
const SRC=GH?[{u:'https://api.github.com/repos/moyan1988/qd-board-7x3q/contents/data.json?ref=data',o:{cache:'no-cache',headers:{Accept:'application/vnd.github.raw+json'}}},{u:'https://raw.githubusercontent.com/moyan1988/qd-board-7x3q/data/data.json?t=',o:{cache:'no-store'}},{u:'data.json?t=',o:{cache:'no-store'}}]:[{u:'data.json?t=',o:{cache:'no-store'}}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=2)=>x===null||x===undefined||x===''||isNaN(+x)?'-':(+x).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
const px=x=>{if(x===null||x===undefined||x===''||isNaN(+x))return'-';x=+x;return Math.abs(x)<0.01?x.toPrecision(5):num(x,Math.abs(x)<10?4:2)};
const cls=x=>+x>0?'up':+x<0?'dn':'';
const t=s=>s?esc(String(s).replace('T',' ').slice(5,16)):'-';
const coin=i=>esc(String(i||'').replace('-USDT-SWAP',''));
const side=s=>s==='long'?'<span class="up">多</span>':s==='short'?'<span class="dn">空</span>':esc(s||'-');
function table(h,rows){return rows.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:'<div class="empty">暂无</div>'}
function chart(pts,start){
 if(pts.length<2){$('chart').innerHTML='<div class="empty">数据不足</div>';return}
 const W=600,H=200,P=36,ys=pts.map(p=>+p.equity_usdt).concat([start]);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){lo-=1;hi+=1}
 const t0=Date.parse(pts[0].time_utc),t1=Date.parse(pts[pts.length-1].time_utc)||t0+1;
 const X=s=>P+(Date.parse(s)-t0)/(t1-t0||1)*(W-P-6),Y=v=>6+(hi-v)/(hi-lo)*(H-26);
 const d=pts.map((p,i)=>(i?'L':'M')+X(p.time_utc).toFixed(1)+','+Y(+p.equity_usdt).toFixed(1)).join('');
 const last=+pts[pts.length-1].equity_usdt,col=last>=start?'#16c784':'#ea3943';
 $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
 <line x1="${P}" x2="${W}" y1="${Y(start)}" y2="${Y(start)}" stroke="#555" stroke-dasharray="4 4"/>
 <text x="2" y="${Y(hi)+10}" fill="#8a90a0" font-size="11">${num(hi,1)}</text><text x="2" y="${Y(lo)}" fill="#8a90a0" font-size="11">${num(lo,1)}</text>
 <text x="2" y="${Y(start)+4}" fill="#8a90a0" font-size="11">400</text>
 <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
 <text x="${P}" y="${H-4}" fill="#8a90a0" font-size="11">${t(pts[0].time_dubai)}</text><text x="${W-4}" y="${H-4}" fill="#8a90a0" font-size="11" text-anchor="end">${t(pts[pts.length-1].time_dubai)}</text></svg>`}
async function load(){
 try{
  let d=null;for(const x of SRC){try{const r=await fetch(x.u.endsWith('t=')?x.u+Date.now():x.u,x.o);if(r.ok){d=await r.json();break}}catch(e){}}if(!d)throw new Error('no data');
  const st=d.status||{},m=st.mode||'?',age=(Date.now()/1000-(st.heartbeat_epoch||0));
  $('mode').textContent=m==='LIVE'?'实盘 LIVE':m==='DRY_RUN'?'模拟 DRY RUN':m;$('mode').className='badge '+(m==='LIVE'?'live':'dry');
  const eq=d.account?.equity_usdt,pnl=eq!=null?eq-d.start_equity:null,upl=(d.positions||[]).reduce((a,p)=>a+(+p.upl||0),0);
  $('eq').textContent=num(eq);$('pnl').innerHTML=`<span class="${cls(pnl)}">${pnl>0?'+':''}${num(pnl)} (${pnl!=null?num(pnl/d.start_equity*100,1):'-'}%)</span>`;
  $('upl').innerHTML=`<span class="${cls(upl)}">${upl>0?'+':''}${num(upl)}</span>`;
  const am=Math.round(age/60);$('hb').innerHTML=age>900?`<span class="badge stale">${am} 分钟前 · 异常</span>`:`<span class="up">${age<90?Math.round(age)+' 秒前':am+' 分钟前'}</span>`;
  const r=d.rules||{};$('rules').textContent=`固定 ${r.lever||5} 倍逐仓 · 每笔保证金 ≤${(r.margin_pct_per_trade||.1)*100}% 权益 · 最多 ${r.max_positions||3} 个持仓 · 交易所保护止损（开仓价反向 8%，只为停机兜底）${st.kill_switch_STOP?' · ⛔ 已暂停开新仓':''}`;
  $('sub').textContent=`策略 ${st.strategy||''} · 数据更新 ${t(new Date(d.generated_epoch*1000+4*3600e3).toISOString())}（${Math.round(Date.now()/1000-d.generated_epoch)} 秒前）`;
  const F=d.freqtrade||{};if(F.status==='ok'){const la=F.log_age_s;$('ftst').textContent=la!=null&&la<1500?'实盘 运行中':'日志 '+Math.round((la||0)/60)+' 分钟未更新';$('ftst').className='badge '+(la!=null&&la<1500?'live':'stale');
   $('ftsub').textContent=`子账户 ${F.label||''} · 策略 ${F.strategy||''} · 5 倍逐仓 · 每仓约 10% 权益、最多 2 仓 · 起点 ${F.start_time_dubai||''}（${num(F.start_equity)}U）· 权益=起始+已实现+浮盈亏（估算）`;
   $('fteq').textContent=num(F.equity_est,2);const pc=x=>x==null?'-':`<span class="${cls(x)}">${x>0?'+':''}${num(x,2)}%</span>`;
   $('ftpnl').innerHTML=pc(F.pnl_pct)+` <small class="mut">${F.realized+F.upl>0?'+':''}${num(F.realized+F.upl,3)}U</small>`;$('ftv41').innerHTML=pc(F.v41_pnl_pct)+` <small class="mut">起 ${num(F.v41_start_equity,1)}U</small>`;
   $('ftcnt').textContent=`${F.closed_count} / ${F.wins}`;
   $('ftpos').innerHTML=table(['持仓','方向','数量','开仓价','标记价','浮盈亏','保证金','止损','强平价'],(F.positions||[]).map(p=>[coin(p.instId),side(p.side),num(p.amount,4),px(p.open_rate),px(p.mark),`<span class="${cls(p.upl)}">${num(p.upl,4)}</span>`,num(p.margin,3),px(p.stop),px(p.liq)]));
   $('fttrd').innerHTML=(F.closed||[]).length?table(['平仓时间','币种','方向','开','平','盈亏','原因'],F.closed.slice().reverse().map(x=>[x.close_date?t(new Date(Date.parse(String(x.close_date).replace(' ','T')+'Z')+4*3600e3).toISOString()):'-',esc(String(x.pair).split('/')[0]),x.is_short?'<span class="dn">空</span>':'<span class="up">多</span>',px(x.open_rate),px(x.close_rate),`<span class="${cls(x.close_profit_abs)}">${num(x.close_profit_abs,4)}</span>`,esc(x.exit_reason)])):'';
  }else{$('ftst').textContent=F.status?'读取失败':'未接入';$('ftst').className='badge stale'}
  chart(d.equity||[],d.start_equity);
  $('pos').innerHTML=table(['币种','方向','张数','开仓价','标记价','浮盈亏','保证金','强平价','距强平','保护止损'],(d.positions||[]).map(p=>[coin(p.instId),side(p.side),num(Math.abs(p.pos),4),px(p.avgPx),px(p.markPx),`<span class="${cls(p.upl)}">${num(p.upl)} (${num((+p.uplRatio||0)*100,1)}%)</span>`,num(p.margin),px(p.liqPx),p.liq_distance_pct==null?'-':`<span class="${p.liq_distance_pct<8?'dn':''}">${num(p.liq_distance_pct,1)}%</span>`,p.stop_trigger?px(p.stop_trigger):'<span class="dn">无</span>']));
  const W_=d.warnings||{},WI=W_.items||{},wAge=W_.epoch?Math.round((Date.now()/1000-W_.epoch)/60):null,NT=d.news_tags||{};
  const dirCell=s=>{if(s.error)return'<span class="dn">错误</span>';const g=s.ema_gap_pct_1h;const near=g!=null&&Math.abs(g)<0.5;
   return `${side(s.trend_1h)} <small>EMA20 ${px(s.ema20_1h)} / EMA60 ${px(s.ema60_1h)}<br>差距 ${g==null?'-':(g>0?'+':'')+num(g,2)+'%'}</small>${near?' <span class="tag t-yel">接近反转</span>':''}`};
  const warnCell=k=>{const w=WI[k];if(!w)return'<span class="mut">—</span>';if(w.error)return`<span class="mut" title="${esc(w.error)}">计算失败</span>`;
   const b=w.bars||{},cnt=['15m','1h','4h'].map(p=>`${p} ${b[p]?b[p].n:'-'}`).join(' · ');
   const lv=w.level==='alert'?'<span class="tag t-red">预警</span>':w.level==='watch'?'<span class="tag t-yel">留意</span>':'<span class="tag t-gry">无</span>';
   const det=['15m','1h','4h'].map(p=>{const x=b[p];if(!x)return'';return `${p}（${esc(x.closed_at||'')} 收）：${x.hit.length?esc(x.hit.join('、')):'无'} <span style="opacity:.75">RSI ${num(x.rsi_prev,1)}→${num(x.rsi,1)} · K/D ${num(x.K,1)}/${num(x.D,1)} · 量比 ${num(x.vol_ratio,2)} · MACD柱 ${x.macd_hist_prev<0?'负':'正'}→${x.macd_hist<0?'负':'正'}</span>`}).join('<br>');
   const dir=`按${w.side==='long'?'多':'空'}${w.side_src==='position'?'（持仓方向）':'（1h 均线方向）'}看反向信号`;
   return `<details><summary title="${esc(dir)}">${lv} <small>${cnt}</small></summary><div class="dl">${esc(dir)}<br>${det}</div></details>`};
  const newsCell=k=>{const c=coin(k).toUpperCase(),st=NT.status;if(!st||st==='missing'||st==='bad')return'<span class="mut">—</span>';const x=(NT.tags||{})[c];if(!x)return'<span class="mut">—</span>';
   if(st==='stale')return`<span class="tag t-gry" title="${esc(x.note)}">过期</span> <small class="mut">${esc(x.tag)}</small>`;
   const pend=/待选币与资讯更新/.test(x.note||'');const tc=x.tag==='利好'?'t-grn':x.tag==='利空'?'t-red':'t-gry';
   return `<span class="tag ${tc}">${esc(x.tag)}${pend?'·待更新':''}</span><br><small>${esc(x.note)}</small>`};
  $('sig').innerHTML=table(['币种','1h 均线方向','盘中预警 <small>(点开看明细)</small>','资讯标签','15m 收盘','20根高','20根低','15m EMA20','信号'],Object.entries(d.signals||{}).map(([k,s])=>[coin(k),dirCell(s),warnCell(k),newsCell(k),px(s.last_15m_close),px(s.hh20_15m),px(s.ll20_15m),px(s.ema20_15m),s.exit_signal?`<span class="dn">平仓：${esc(s.exit_signal)}</span>`:s.entry_signal?`<b>开${s.entry_signal==='long'?'多':'空'}</b>`:s.position?'持仓中':'<span class="mut">等待</span>'])).replace(/<td>(<span class="(?:up|dn)">[多空]<\/span> <small>EMA20)/g,'<td class="wrap">$1').replace(/<td>(<details>|<span class="tag t-(?:grn|red|gry)">[^<]*<\/span><br>)/g,'<td class="wrap">$1');
  $('sigfoot').innerHTML=`预警规则 v1：KDJ(9,3,3) 低位金叉 / RSI(14) 上穿 30 / MACD 柱负转正 / 量比≥1.5 阳线（多方向对称），15m·1h·4h 各取最近已收盘 K 线；同一周期≥2 项＝<span class="tag t-red">预警</span>，1 项＝<span class="tag t-yel">留意</span>。差距＝(EMA20−EMA60)/EMA60，绝对值&lt;0.5% 标「接近反转」。预警计算于 ${esc(W_.time_dubai||'-')}${wAge!=null&&wAge>10?` <span class="dn">（${wAge} 分钟前，偏旧）</span>`:''}；资讯更新于 ${esc(NT.updated||'-')}${NT.status==='stale'?' <span class="dn">已过期</span>':''}。`;
  $('trd').innerHTML=table(['时间','币种','动作','方向','张数','成交价','已实现盈亏','手续费','原因'],(d.trades||[]).slice().reverse().map(x=>[t(x.time_dubai)+(x.dry_run?' <span class="badge dry">模拟</span>':''),coin(x.instId),x.action==='open'?'开仓':x.action==='close'?'平仓':esc(x.action),side(x.side),esc(x.size_contracts),px(x.price),`<span class="${cls(x.pnl)}">${x.pnl==null?'-':num(x.pnl,4)}</span>`,x.fee==null?'-':num(x.fee,4),esc(x.reason)]));
  $('fund').innerHTML=table(['时间','币种','金额'],(d.funding||[]).slice().reverse().map(x=>[t(x.time_dubai),coin(x.instId),`<span class="${cls(x.amount)}">${num(x.amount,4)}</span>`]));
  $('alr').innerHTML=table(['时间','来源','类型','详情'],(d.alerts||[]).slice().reverse().map(x=>[t(x.time_dubai),esc(x.source),esc(x.kind),`<span style="white-space:normal">${esc(JSON.stringify(x.detail)).slice(0,160)}</span>`]));
 }catch(e){$('sub').innerHTML='<span class="dn">数据加载失败，稍后自动重试</span>'}
}
load();setInterval(load,60000);
</script></body></html>
